<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Exhibition sales CRM{% endblock %}</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 1rem; color: #1a1a1a; }
  a { color: #0b5cad; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { width: 11rem; font-weight: 600; }
  label { display: block; margin: .5rem 0; }
  input, textarea, button { font: inherit; }
  textarea { width: 100%; box-sizing: border-box; }
  .badge { padding: .1rem .45rem; border-radius: 4px; font-weight: 600; }
  .ready { background: #d7f0dc; } .provisional { background: #fff0bf; } .blocked { background: #f7d6d6; }
  .notice { background: #fff0bf; padding: .5rem .75rem; border-radius: 4px; }
  .error { background: #f7d6d6; padding: .5rem .75rem; border-radius: 4px; }
  .muted { color: #666; font-size: .9em; }
  pre { background: #f4f4f4; padding: .75rem; overflow-x: auto; font-size: .85em; }
</style>
</head>
<body>
<p><a href="{{ url_for('index') }}">Exhibition sales CRM</a></p>
{% block content %}{% endblock %}
</body>
</html>
